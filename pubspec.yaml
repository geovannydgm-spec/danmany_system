name: asistencia_escolar_app
description: "Aplicación de control de asistencia escolar"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.2

  # 👇 Dependencia necesaria para localización
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.1

  # Firebase (últimas versiones estables, compatibles con Flutter 3.22+)
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_core_web: ^3.1.0

  # Internacionalización
  intl: ^0.20.2

  # QR y escaneo
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0

  # Utilidades
  http: ^1.2.2
  flutter_riverpod: ^2.5.1
  file_picker: ^10.3.2
  excel: ^4.0.6
  xml: ^6.6.1
  path_provider: ^2.1.5
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.3.1

  # pdf:
  pdf: ^3.10.8
  printing: ^5.10.0
  share_plus: ^11.1.0
  universal_html: ^2.2.1
  firebase_storage: ^13.0.1
  cached_network_image: ^3.2.3
  connectivity_plus: ^7.0.0
  flutter_launcher_icons: ^0.14.4

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/Alumno.png
    - assets/icons/icon.png # <-- Cambio: Añadir la ruta del ícono aquí

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"