<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de Control de Asistencia Escolar - Danmany Sistem">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Asistencia Escolar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon - Tu logo -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Asistencia Escolar | Danmany Sistem</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Pantalla de carga mientras Flutter inicializa */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #6200ea, #1ee9d5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #loading-screen img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      object-fit: cover;
    }

    #loading-screen p {
      color: white;
      font-size: 16px;
      letter-spacing: 1px;
      margin: 0;
      opacity: 0.9;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Ocultar loading cuando Flutter carga */
    flutter-view, flt-glass-pane {
      display: block !important;
    }
  </style>
</head>
<body>
  <!-- Pantalla de carga con tu logo -->
  <div id="loading-screen">
    <img src="icons/Icon-192.png" alt="Danmany Sistem" 
         onerror="this.style.display='none'">
    <p>Asistencia Escolar</p>
    <div class="spinner"></div>
  </div>

  <script>
    // Ocultar pantalla de carga cuando Flutter esté listo
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading-screen');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.5s ease';
        setTimeout(() => loading.style.display = 'none', 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
